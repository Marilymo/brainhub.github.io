<!DOCTYPE html>
<html>
<head>
    <title> Library page </title>
    <meta charset="UTF-8">
    <link rel = "stylesheet" href ="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Exo:wght@400;600&family=Rubik+One&display=swap" rel="stylesheet">    
</head>

<body class="library-page">
    
    <div id="readCounterBox">
        <h3> Books in library: <span id="totalBooks"> 0 </span></h3>
    </div>


    

    <div class="title-box">
        <h1> MY LIBRARY </h1>
        <a href="index.html"> <button class="backBtn" id="backBtn"> ← </button> </a>
    </div>

    <div id="addBookBtnContainer">
        <button id="addBookBtn">Add book</button>
    </div>

    <div id="addBookPopup" class="popup">
        <div class="popup-content">
            <h3>Add a New Book</h3>
            <input type="text" id="bookTitle" placeholder="Title">
            <input type="text" id="bookAuthor" placeholder="Author">
            <input type="text" id="bookCover" placeholder="Cover (emoji or text)">
            <div style="margin-top:10px;">
                <button id="saveBookBtn">Save</button>
                <button id="cancelBtn">Cancel</button>
            </div>
        </div>
    </div>

    <div id="libraryList"></div>
    <script src="library.js"></script>


</body>
</html>
